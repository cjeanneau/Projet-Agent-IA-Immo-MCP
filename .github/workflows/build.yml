# .github/workflows/build.yml
name: Build and Push Images

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ secrets.GHCR_USER }}/immo-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push MCP server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mcp
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-mcp-server:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-mcp-server:${{ github.sha }}

      - name: Build and push FastAPI app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-fastapi-app:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-fastapi-app:${{ github.sha }}
