# .github/workflows/deploy.yml
name: Deploy to K3S

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Push Images"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create inventory
        run: |
          mkdir -p ansible
          cat > ansible/inventory.ini << EOF
          [production]
          server ansible_host=${{ secrets.SERVER_HOST }} ansible_user=${{ secrets.SERVER_USER }}
          EOF

      - name: Copy manifests to server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ~/immo-mcp/k8s"
          scp k8s/mcp-server.yaml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/immo-mcp/k8s/
          scp k8s/fastapi-app.yaml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/immo-mcp/k8s/

      - name: Run Ansible
        run: >
          ansible-playbook ansible_playbook.yml
          -i ansible/inventory.ini
          -e "ghcr_user=${{ secrets.GHCR_USER }}"
          -e "ghcr_token=${{ secrets.GHCR_TOKEN }}"
          -e "image_prefix=${{ secrets.GHCR_USER }}/immo-mcp"
          -e "mistral_api_key=${{ secrets.MISTRAL_API_KEY }}"
          -e "gemini_api_key=${{ secrets.GEMINI_API_KEY }}"