[project]
name = "projet-immo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.2",
    "tenacity>=9.0.0",
]

[dependency-groups]
fastapi = [
    "fastapi>=0.119.1",
    "uvicorn>=0.38.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.6",
    "prometheus-client>=0.23.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "langchain>=1.2.10",
    "langchain-mistralai>=1.1.1",
    "langchain-mcp-adapters>=0.2.2",
    "httpx>=0.28.0",
]
mcp = [
    "fastmcp>=3.2.0",
    "duckdb>=1.5.0",
    "aiohttp>=3.13.3",
    "requests>=2.32.5",
    "shapely>=2.1.2",
    "diskcache>=5.6.3",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn==1.7.2",
    "xgboost==3.1.1",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "coverage>=7.13.4",
    "jupyterlab>=4.4.9",
    "missingno>=0.5.2",
    "shap>=0.49.1",
    "dvc>=3.63.0",
    "mlflow>=3.5.0",
    "skl2onnx>=1.19.1",
    "tinydb>=4.8.2",
    "optuna>=4.5.0",
    "marimo>=0.18.4",
    "openpyxl>=3.1.5",
    "langchain-google-genai>=4.2.1",
    "gitingest",
]
unused = [
    "onnxruntime>=1.23.2",
    "openai>=2.30.0",
    "langchain-openai>=1.1.12",
    "certifi>=2026.2.25",
]

[tool.uv]
override-dependencies = [
    "nvidia-nccl-cu12 ; sys_platform == 'never'",
]
