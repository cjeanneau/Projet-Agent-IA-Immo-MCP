# k8s/mcp-server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      __IMAGE_PULL_SECRETS__
      containers:
        - name: mcp-server
          image: __MCP_IMAGE__
          imagePullPolicy: __PULL_POLICY__
          ports:
            - containerPort: 8100
          env:
            - name: BPE_INSEE
              value: "/app/data/bpe_insee.duckdb"
            - name: MODEL
              value: "/app/model/deploy/best_model3.pkl"
          envFrom:
            - secretRef:
                name: api-keys
          volumeMounts:
            - name: db
              mountPath: /app/data
            - name: model
              mountPath: /app/model/deploy
              readOnly: true
      volumes:
        - name: db
          hostPath:
            path: __PROJECT_ROOT__/data
            type: Directory
        - name: model
          hostPath:
            path: __PROJECT_ROOT__/model/deploy
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: __NAMESPACE__
spec:
  type: ClusterIP
  selector:
    app: mcp-server
  ports:
    - port: 8100
      targetPort: 8100
      nodePort: __NODE_PORT__