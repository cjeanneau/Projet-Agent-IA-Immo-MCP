apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: mcp-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8100
          envFrom:
            - secretRef:
                name: api-keys
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  type: ClusterIP
  selector:
    app: mcp-server
  ports:
    - port: 8100
      targetPort: 8100